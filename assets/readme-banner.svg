<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">LPE — Lux Path Expressions</title>
  <desc id="desc">Parse price * quantity into an AST, then evaluate it with price 120 and quantity 3 to get 360.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d30"/>
      <stop offset="1" stop-color="#0a111f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3e8f9c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#3e8f9c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <ellipse cx="1000" cy="80" rx="420" ry="320" fill="url(#glow)"/>
  <path d="M530 0V400M0 344H1280" stroke="#243347" stroke-opacity=".6"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="44" width="6" height="24" rx="3" fill="#8ae1c0"/>
    <text x="68" y="62" font-size="14" letter-spacing="3" fill="#a6b9cb">EXPRESSION ENGINE</text>
    <text x="43" y="185" font-size="110" font-weight="700" letter-spacing="-5" fill="#edf5fc">LPE<tspan fill="#8ae1c0">.</tspan></text>
    <text x="49" y="231" font-size="28" fill="#d6e1ed">Lux Path Expressions</text>
    <text x="50" y="276" font-size="18" fill="#8ea5bc">Parse. Evaluate. Deparse.</text>
    <text x="50" y="377" font-size="13" letter-spacing="2" fill="#7f96ac">JAVASCRIPT</text>
    <circle cx="182" cy="372" r="2" fill="#587287"/>
    <text x="202" y="377" font-size="13" letter-spacing="2" fill="#7f96ac">LISP-STYLE AST</text>
    <circle cx="363" cy="372" r="2" fill="#587287"/>
    <text x="383" y="377" font-size="13" letter-spacing="2" fill="#7f96ac">MIT</text>
  </g>
  <g font-family="Consolas, Menlo, monospace">
    <rect x="582" y="37" width="648" height="80" rx="12" fill="#142338" stroke="#30495e"/>
    <text x="604" y="63" font-size="12" letter-spacing="2" fill="#819ab3">EXPRESSION</text>
    <text x="604" y="94" font-size="23" fill="#eef6ff">price <tspan fill="#8ae1c0">*</tspan> quantity</text>
    <path d="M902 118V145m-5-6 5 6 5-6" fill="none" stroke="#5c8190" stroke-width="1.5"/>
    <rect x="582" y="148" width="648" height="80" rx="12" fill="#142338" stroke="#30495e"/>
    <text x="604" y="174" font-size="12" letter-spacing="2" fill="#819ab3">AST</text>
    <text x="604" y="205" font-size="23" fill="#8ae1c0">[&quot;*&quot;, &quot;price&quot;, &quot;quantity&quot;]</text>
    <path d="M902 229V256m-5-6 5 6 5-6" fill="none" stroke="#5c8190" stroke-width="1.5"/>
    <text x="604" y="287" font-size="12" letter-spacing="2" fill="#819ab3">RESULT</text>
    <text x="604" y="326" font-size="37" font-weight="700" fill="#8ae1c0">360</text>
    <text x="582" y="377" font-size="15" fill="#93aabd">context: { price: 120, quantity: 3 }</text>
  </g>
</svg>
