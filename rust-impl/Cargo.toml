[package]
name = "lpe"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Native Rust Lux Path Expressions parser and interpreter"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
indexmap = "2"
futures = "0.3"
chrono = "0.4"
regress = { version = "=0.12.0", features = ["utf16"] }
rand = "0.8"
ryu-js = "1"
smallvec = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sonic-rs = "0.5.10"

[patch.crates-io]
regress = { path = "vendor/regress" }

[[bin]]
name = "lpe"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
